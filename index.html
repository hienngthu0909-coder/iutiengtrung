// ====== TIỂU ĐÀO · App ======
const $ = s => document.querySelector(s);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const STANDALONE = !!window.TIEUDAO_STANDALONE;
const LIB_OPENCC = window.TIEUDAO_OPENCC || 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/t2cn.js';
const IS_PHONE = IS_TOUCH && Math.min(screen.width, screen.height) < 600;
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const isCJK = c => /[\u3400-\u9fff\uf900-\ufaff]/.test(c);
const cjkCount = s => [...(s||'')].filter(isCJK).length;
const fmt = t => { if (t == null || isNaN(t)) return '--:--'; t = Math.max(0, t); const m = Math.floor(t/60), s = Math.floor(t%60); return m + ':' + String(s).padStart(2,'0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const wid = h => 'w' + [...h].map(c => c.codePointAt(0).toString(36)).join('-');
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }

// ---------- Pinyin ----------
function pyArr(text) {
  const chars = [...text].filter(isCJK);
  if (!window.pinyinPro || !chars.length) return chars.map(() => '');
  try {
    const arr = pinyinPro.pinyin(text, { type: 'array', nonZh: 'removed' });
    if (arr.length === chars.length) return arr;
  } catch (e) {}
  try { return chars.map(c => pinyinPro.pinyin(c)); } catch (e) { return chars.map(() => ''); }
}
function py(text) { return pyArr(text || '').join(' '); }
function ruby(text) {
  const p = pyArr(text); let i = 0;
  return [...text].map(c => isCJK(c) ? `<ruby>${esc(c)}<rt>${esc(p[i++]||'')}</rt></ruby>` : esc(c)).join('');
}
const toneless = p => (p || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// ---------- So sánh lời nói ----------
function lcsPairs(a, b) {
  const n = a.length, m = b.length; const dp = Array.from({length: n+1}, () => new Uint16Array(m+1));
  for (let i = n-1; i >= 0; i--) for (let j = m-1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const pairs = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { pairs.push([i,j]); i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return pairs;
}
function compareSpeech(target, said) {
  const T = [...target].filter(isCJK), S = [...(said||'')].filter(isCJK);
  if (!T.length) return null;
  const st = T.map(() => 'miss');
  lcsPairs(T, S).forEach(([i]) => st[i] = 'ok');
  const Tp = pyArr(T.join('')), Sp = pyArr(S.join(''));
  lcsPairs(Tp.map(toneless), Sp.map(toneless)).forEach(([i,j]) => {
    if (st[i] === 'ok') return;
    st[i] = Tp[i] === Sp[j] ? 'snd' : 'tone';
  });
  const ok = st.filter(x => x === 'ok' || x === 'snd').length, tone = st.filter(x => x === 'tone').length;
  const score = Math.round((ok + tone*0.5) / T.length * 100);
  return { T, st, score, ok, tone, miss: st.filter(x => x === 'miss').length };
}
function renderCompare(r) {
  if (!r) return '';
  const msg = r.score >= 90 ? 'Tuyệt vời! 🌸' : r.score >= 70 ? 'Khá lắm, luyện thêm chút nữa nhé 💪' : r.score >= 40 ? 'Cố lên, nghe mẫu rồi nói chậm lại 🐢' : 'Thử lại nhé 🍑';
  return `<div class="res" style="margin-top:8px"><div class="row"><span class="score">${r.score}%</span><span class="muted">${msg}</span></div>
  <div style="margin:6px 0">${r.T.map((c,i) => `<span class="c ${r.st[i]}">${esc(c)}</span>`).join('')}</div>
  <div class="legend tiny muted"><span><span class="c ok">字</span> đúng</span><span><span class="c snd">字</span> đúng âm, khác chữ</span><span><span class="c tone">字</span> có thể sai thanh</span><span><span class="c miss">字</span> thiếu / sai</span></div></div>`;
}

// ---------- Claude capabilities ----------
const Cap = { sample: null, dict: null, tts: null };
function webSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  let rec = null; const cb = {};
  return {
    onPartial(f) { cb.p = f; }, onFinal(f) { cb.f = f; }, onState(f) { cb.s = f; },
    start() {
      rec = new SR(); rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = true;
      rec.onresult = e => { let interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) cb.f && cb.f({ text: r[0].transcript }); else interim += r[0].transcript; } cb.p && cb.p({ text: interim }); };
      rec.onstart = () => cb.s && cb.s({ state: 'listening' });
      rec.onend = () => cb.s && cb.s({ state: 'idle' });
      rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Trình duyệt chưa cho phép dùng micro.'); };
      try { rec.start(); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
    },
    stop() { try { rec && rec.stop(); } catch (e) {} return Promise.resolve(); }
  };
}
async function initCaps() {
  if (STANDALONE) { const d = webSpeech(); if (d) { Cap.dict = d; Mic.bind(d); } return; }
  if (!window.claude || !claude.use) return;
  claude.use('sample').then(s => Cap.sample = s).catch(() => {});
  claude.use('tts').then(t => { Cap.tts = t; }).catch(() => {});
  claude.use('dictation').then(d => { Cap.dict = d; if (d) Mic.bind(d); rerenderSoft(); }).catch(() => {});
}
function aiErr(e) {
  const c = e && e.code;
  if (c === 'not_granted') return STANDALONE ? 'Chưa có mật khẩu AI đúng.' : 'Bạn chưa cho phép dùng AI trên trang này.';
  if (c === 'rate_limited') return 'AI đang bận, thử lại sau ít phút nhé.';
  if (c === 'no_ai') return 'Tính năng AI chỉ chạy khi mở trang trên claude.ai (đã đăng nhập).';
  return 'AI gặp lỗi: ' + ((e && e.message) || 'không rõ') + '';
}
function parseJSON(t) {
  t = (t || '').trim().replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.indexOf('[');
  const s = a < 0 ? b : b < 0 ? a : Math.min(a, b);
  const e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  return JSON.parse(t.slice(s, e + 1));
}
const AI_SYS = 'Bạn là cô giáo tiếng Trung thân thiện, dạy học viên người Việt đang ở trình độ HSK5, hướng tới HSK6 theo chuẩn HSK 3.0. Giải thích bằng tiếng Việt, ví dụ bằng tiếng Trung giản thể.';
const blobB64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(b); });
async function aiHttp(full, opts) {
  const pw = (() => { try { return localStorage.getItem('tieudao_pw') || ''; } catch (e) { return ''; } })();
  const images = opts.images ? await Promise.all(opts.images.map(blobB64)) : [];
  const r = await fetch('/api/ai', { method: 'POST', headers: { 'content-type': 'application/json', 'x-app-password': pw }, body: JSON.stringify({ prompt: full, images, tier: opts.modelTier || '' }) });
  if (r.status === 401) { const p = await promptBox('Nhập mật khẩu AI của trang (APP_PASSWORD đã đặt trên Vercel)', ''); if (p) { try { localStorage.setItem('tieudao_pw', p); } catch (e) {} return aiHttp(full, opts); } throw { code: 'not_granted' }; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw { message: j.error || ('HTTP ' + r.status) };
  return { text: j.text || '' };
}
async function ai(prompt, { json = false, images = null, tier = null } = {}) {
  if (STANDALONE) { const opts = { images, modelTier: tier }; const r = await aiHttp(AI_SYS + '\n\n' + prompt + (json ? '\n\nCHỈ trả về JSON hợp lệ, không markdown, không giải thích thêm.' : ''), opts); return json ? parseJSON(r.text) : r.text; }
  if (!Cap.sample && window.claude && claude.use) { try { Cap.sample = await claude.use('sample'); } catch (e) {} }
  if (!Cap.sample) throw { code: 'no_ai' };
  const opts = {}; if (images) opts.images = images; if (tier) opts.modelTier = tier;
  const full = AI_SYS + '\n\n' + prompt + (json ? '\n\nCHỈ trả về JSON hợp lệ, không markdown, không giải thích thêm.' : '');
  const r = await Cap.sample(full, opts);
  return json ? parseJSON(r.text) : r.text;
}
async function busy(btn, fn) {
  if (btn) { btn.disabled = true; btn._h = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> Đang làm…'; }
  try { return await fn(); } catch (e) { console.error(e); toast(e && (e.code || e.message) ? aiErr(e) : 'Có lỗi xảy ra', 4000); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = btn._h; } }
}

// ---------- Giọng đọc ----------
let zhVoices = [];
function loadVoices() { try { zhVoices = speechSynthesis.getVoices().filter(v => /^zh|cmn/i.test(v.lang)); } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function bestVoice() {
  if (!zhVoices.length) return null;
  const pref = S.settings.voiceName && zhVoices.find(v => v.name === S.settings.voiceName);
  return pref || zhVoices.find(v => /zh[-_]CN/i.test(v.lang) && /Xiaoxiao|Yunxi|Google|Ting|Natural/i.test(v.name)) || zhVoices.find(v => /zh[-_]CN/i.test(v.lang)) || zhVoices[0];
}
let seqTok = 0;
async function playSeq(arr, rate) { const tok = ++seqTok; for (const t of arr) { if (tok !== seqTok) return; await speak(t, rate); if (tok !== seqTok) return; await new Promise(r => setTimeout(r, 250)); } }
const clean = h => String(h || '').replace(/```html|```/g, '').replace(/<(script|style|iframe|object|embed)[\s\S]*?<\/\1>/gi, '').replace(/<(script|iframe|object|embed)[^>]*>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '').replace(/javascript:/gi, '');
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} try { Cap.tts && Cap.tts.stop(); } catch (e) {} }
async function speak(text, rate) {
  rate = rate || S.settings.rate || 1; stopSpeak();
  const v = S.settings.voice !== 'claude' ? bestVoice() : null;
  if (v) {
    return new Promise(res => { const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = rate; u.onend = u.onerror = res; speechSynthesis.speak(u); });
  }
  if (Cap.tts) {
    const r = Math.min(1.5, Math.max(0.7, rate));
    try { await Cap.tts.speak(text, { rate: r, language: 'zh-CN' }); return; } catch (e) {
      if (e && (e.code === 'viewer_stopped' || e.code === 'busy')) return;
      try { await Cap.tts.speak(text, { rate: r }); return; } catch (e2) {}
    }
  }
  toast('Không tìm thấy giọng đọc tiếng Trung. Hãy cài giọng zh-CN cho máy hoặc mở bằng Chrome.', 4500);
}

// ---------- Micro (dictation) ----------
const Mic = {
  d: null, target: null, text: '', partial: '', on: false, cb: null,
  bind(d) {
    this.d = d;
    try { d.onPartial(({text}) => { this.partial = text || ''; this.paint(); }); } catch (e) {}
    try { d.onFinal(({text}) => { this.text += (text || ''); this.partial = ''; this.paint(); }); } catch (e) {}
    try { d.onState(({state}) => {
      if (state === 'listening') { this.on = true; this.paintBtn(); }
      else if (state === 'idle') { const was = this.on; this.on = false; this.paintBtn(); if (was && this.target) this.finish(); }
    }); } catch (e) {}
  },
  // phải gọi trực tiếp trong click
  toggle(target, cb) {
    if (!this.d) { toast(IS_TOUCH ? 'Bấm vào ô chữ bên dưới rồi chạm biểu tượng 🎤 trên bàn phím để nói tiếng Trung (bật bàn phím Tiếng Trung giản thể trong Cài đặt).' : 'Micro chỉ chạy trên Chrome/ứng dụng Claude máy tính. Bạn có thể dùng bàn phím giọng nói (Win+H) để nói vào ô chữ.', 6000); const ta = document.getElementById('said-' + target); if (ta) ta.focus(); return; }
    if (this.on && this.target === target) { this.d.stop().catch(() => {}); return; }
    if (this.on) { try { this.d.stop(); } catch (e) {} }
    stopSpeak();
    this.target = target; this.cb = cb; this.text = ''; this.partial = '';
    this.d.start().catch(e => { this.on = false; this.paintBtn(); if (e && e.code === 'not_granted') toast('Bạn đã tắt quyền micro. Có thể gõ / dùng bàn phím giọng nói thay thế.', 4500); else if (e && e.code !== 'dismissed') toast('Không bật được micro.'); });
    this.on = true; this.paintBtn();
  },
  paint() { const ta = document.getElementById('said-' + this.target); if (ta) { ta.value = this.text + this.partial; S.said[this.target] = ta.value; } },
  paintBtn() { $$('[data-mic]').forEach(b => { const me = this.on && b.dataset.mic === this.target; b.classList.toggle('rec', me); b.innerHTML = me ? '⏹ Dừng' : '🎙 Nói'; }); },
  finish() { const t = this.target; const txt = (this.text + this.partial).trim(); S.said[t] = txt; const ta = document.getElementById('said-' + t); if (ta) ta.value = txt; if (this.cb) this.cb(t, txt); }
};
function micBtn(id, extra = '') { const me = Mic.on && Mic.target === id; return `<button class="btn ${me ? 'rec' : ''} ${extra}" data-act="mic" data-mic="${esc(id)}">${me ? '⏹ Dừng' : '🎙 Nói'}</button>`; }

// ---------- Lưu trữ ----------
const Store = {
  cloud: false, db: null, uid: null, q: Promise.resolve(),
  key: c => 'tieudao_' + c,
  lget(c) { try { return JSON.parse(localStorage.getItem(this.key(c)) || '{}'); } catch (e) { return {}; } },
  lset(c, o) { try { localStorage.setItem(this.key(c), JSON.stringify(o)); } catch (e) { toast('Bộ nhớ trình duyệt đầy hoặc bị chặn.'); } },
  async init() {
    if (!window.claude || !claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = user ? await user.id() : null;
      if (db && id) { this.db = db; this.uid = id; this.cloud = true; }
    } catch (e) {}
  },
  base() { return this.db.doc('data/users/' + this.uid + '/hoc'); },
  async all(c) {
    if (!this.cloud) return Object.values(this.lget(c));
    const out = []; let last = '';
    for (let k = 0; k < 30; k++) {
      let q = this.base().collection(c).orderBy('k').limit(1000);
      if (last) q = this.base().collection(c).where('k', '>', last).orderBy('k').limit(1000);
      const s = await q.get(); s.docs.forEach(d => out.push(Object.assign({}, d.data(), { id: d.id })));
      if (s.size < 1000) break; last = s.docs[s.docs.length - 1].data().k;
    }
    return out;
  },
  put(c, obj) {
    const o = JSON.parse(JSON.stringify(obj)); o.k = o.id;
    if (this.cloud) this.q = this.q.then(() => this.base().collection(c).doc(o.id).set(o)).catch(e => this.err(e));
    else { const m = this.lget(c); m[o.id] = o; this.lset(c, m); }
  },
  del(c, id) {
    if (this.cloud) this.q = this.q.then(() => this.base().collection(c).doc(id).delete()).catch(e => this.err(e));
    else { const m = this.lget(c); delete m[id]; this.lset(c, m); }
  },
  async getProfile() {
    if (!this.cloud) { const p = this.lget('profile'); return p && p.days ? p : null; }
    const s = await this.db.doc('data/users/' + this.uid + '/profile').get(); return s.exists ? s.data() : null;
  },
  putProfile(p) {
    const o = JSON.parse(JSON.stringify(p));
    if (this.cloud) this.q = this.q.then(() => this.db.doc('data/users/' + this.uid + '/profile').set(o)).catch(e => this.err(e));
    else this.lset('profile', o);
  },
  err(e) { console.warn(e); if (e && e.code === 'quota_exceeded') toast('Kho lưu trữ đã đầy, hãy xoá bớt dữ liệu cũ.', 5000); else if (e && e.code === 'unavailable') toast('Mất kết nối lưu trữ, thử lại sau.'); }
};

function addWord(w, src) {
  const id = wid(w.h); if (S.words[id]) return false;
  const o = { id, h: w.h, p: w.p || py(w.h), m: w.m || '', ex: w.ex || '', exvi: w.exvi || '', hv: w.hv || '', lv: w.lv || 'MOI', src: src || w.src || 'tu-them', ease: 2.5, ivl: 0, reps: 0, due: Date.now(), added: Date.now() };
  S.words[id] = o; Store.put('words', o); return true;
}
function dueWords() { const now = Date.now(); return Object.values(S.words).filter(w => w.due <= now).sort((a, b) => a.due - b.due); }
function nextIvl(w, g) {
  let ivl = w.ivl || 0, ease = w.ease || 2.5;
  if (g === 0) return { ivl: 0, ease: Math.max(1.3, ease - 0.2), due: Date.now() + 10 * 60e3 };
  if (g === 1) { ivl = Math.max(1, ivl * 1.2); ease = Math.max(1.3, ease - 0.15); }
  if (g === 2) ivl = ivl ? ivl * ease : 1;
  if (g === 3) { ivl = ivl ? ivl * ease * 1.3 : 3; ease += 0.15; }
  ivl = Math.round(ivl * 10) / 10;
  return { ivl, ease, due: Date.now() + ivl * DAY };
}
const ivlLabel = o => o.ivl === 0 ? '10 phút' : o.ivl < 1.5 ? '1 ngày' : o.ivl < 30 ? Math.round(o.ivl) + ' ngày' : Math.round(o.ivl / 30) + ' tháng';
function gradeWord(g) {
  const w = S.flash.cur; if (!w) return;
  Object.assign(w, nextIvl(w, g)); w.reps = (w.reps || 0) + 1; Store.put('words', w); bump('rev');

}

function tickTimer() {

  upd(); S._ti = setInterval(upd, 1000);
}

function listenPool(src) {
  const out = [];
  if (src === 'bank' || src === 'all') { SPEAK_BANK.daily.concat(SPEAK_BANK.pattern).forEach(x => out.push(x)); SPEAK_BANK.dialog.forEach(d => d.lines.forEach(l => out.push(l))); }
  if (src === 'mine' || src === 'all') phraseList().forEach(p => out.push({ zh: p.zh, vi: p.vi }));
  if (src === 'drama' || src === 'all') Object.values(S.clips).forEach(c => (c.sents || []).forEach(s => { if (cjkCount(s.zh) >= 4) out.push({ zh: s.zh, vi: s.vi }); }));
  if (src === 'lesson' || src === 'all') Object.values(S.lessons).forEach(l => splitSent(l.text).forEach(s => { if (cjkCount(s) >= 6) out.push({ zh: s.trim(), vi: '' }); }));
  return out;
}

    case 'say': e.stopPropagation(); speak(d.t); break;

    case 'stopSpeak': seqTok++; stopSpeak(); break;

    case 'flip': S.flash.flipped = !S.flash.flipped; render(); if (S.flash.flipped && S.flash.cur) speak(S.flash.cur.h); break;

function doCheck(id, t) { const said = (S.said[id] || '').trim(); if (!said) { toast('Hãy nói hoặc gõ câu trước đã'); return; } S.res[id] = compareSpeech(t, said); bump('speak'); const box = document.getElementById('r-' + id); if (box) box.innerHTML = renderCompare(S.res[id]); }
function onMicDone(id, txt) {
  if (id === 'topic') { S.said.topic = ((S.said.topic || '') + ' ' + txt).trim(); const ta = $('#said-topic'); if (ta) ta.value = S.said.topic; return; }
  if (id === 'shadow') {
    const s = curSent(); if (!s) return; if (!txt) { const ta = $('#said-shadow'); txt = ta ? ta.value.trim() : ''; } const r = compareSpeech(s.zh, txt); S.res.shadow = r; bump('shadow');
    const sr = $('#shadowRes'); if (sr) sr.innerHTML = `<div class="small" style="margin-top:8px">Bạn nói: <span class="zh">${esc(txt || '(không nghe thấy gì)')}</span></div>` + renderCompare(r) + (Drama.mode === 'shadow' ? '<div class="tiny muted">Tự chuyển câu tiếp sau 2 giây… (bấm ↺ để luyện lại)</div>' : '');
    if (Drama.mode === 'shadow' && r && r.score >= 0) { clearTimeout(S._nx); S._nx = setTimeout(() => { if (S.res.shadow === r && Drama.idx < Drama.clip.sents.length - 1) { S.res.shadow = null; playSent(Drama.idx + 1); } }, 2200); }
    return;
  }
  const m = id.match(/^(daily|pattern)(\d+)$|^dlg(\d+)-(\d+)$|^para(\d+)$|^ph-(.+)$/);
  let t = null;
  if (m) { if (m[1]) t = SPEAK_BANK[m[1]][+m[2]].zh; else if (m[3] != null) t = SPEAK_BANK.dialog[+m[3]].lines[+m[4]].zh; else if (m[5] != null) t = SPEAK_BANK.para[+m[5]].zh; else if (m[6] && S.phrases[m[6]]) t = S.phrases[m[6]].zh; }
  if (t) doCheck(id, t);
}
function syncMark() {
  const D = Drama; if (!D.video) { toast('Cần có video'); return; } const ss = D.clip.sents; if (D.syncI >= ss.length) { toast('Đã gắn giờ hết các câu 🎉'); return; }
  const t = D.video.currentTime; ss[D.syncI].s = Math.max(0, t - 0.15); if (D.syncI > 0 && ss[D.syncI - 1].e == null) ss[D.syncI - 1].e = t - 0.15;
  D.syncI++; if (D.syncI === ss.length) ss[ss.length - 1].e = ss[ss.length - 1].s + 4;
  ss.forEach((s, i) => { if (s.s != null && s.e == null && ss[i + 1] && ss[i + 1].s != null) s.e = ss[i + 1].s; });
  D.save(); renderCtrl(); renderSents(); const el = $('#si-' + D.syncI); if (el) el.scrollIntoView({ block: 'nearest' });
}
function ocrStart() { if (!Drama.video) { toast('Cần có video'); return; } Drama.mark = Drama.video.currentTime; const st = $('#ocrState'); if (st) st.textContent = 'Đang ghi từ ' + fmt(Drama.mark); }
function ocrEnd(btn) { if (!Drama.video) return; const e = Drama.video.currentTime; const s = Drama.mark != null ? Drama.mark : Math.max(0, e - 3); Drama.mark = null; ocrAdd(s, e + 0.2, btn || $('[data-act=ocrE]')); }
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (S.page === 'vocab' && S.ui.vtab === 'review') {
    if (e.code === 'Space') { e.preventDefault(); S.flash.flipped = !S.flash.flipped; render(); if (S.flash.flipped && S.flash.cur) speak(S.flash.cur.h); }
    else if (S.flash.flipped && /^[1-4]$/.test(e.key)) gradeWord(+e.key - 1);
    return;
  }
  if (S.page === 'drama' && Drama.clip) {
    const k = e.key.toLowerCase();
    if (e.code === 'Space') { e.preventDefault(); $('[data-act=dplay]') && $('[data-act=dplay]').click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); playSent(Math.max(0, Drama.idx - 1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); playSent(Math.min(Drama.clip.sents.length - 1, Drama.idx + 1)); }
    else if (k === 'r') playSent(Math.max(0, Drama.idx));
    else if (k === 'm') Mic.toggle('shadow', onMicDone);
    else if (e.key === 'Enter' && Drama.mode === 'sync') { e.preventDefault(); syncMark(); }
    else if (k === 's' && Drama.mode === 'ocr') ocrStart();
    else if (k === 'e' && Drama.mode === 'ocr') ocrEnd();
  }
});

// ---- Nhận dạng giọng nói (Whisper chạy ngay trong trình duyệt) ----
const ASR = {
  worker: null, seq: 0, wait: {}, onMsg: null, job: null, state: {}, // state[clipId] = {pct, status, msg}
  base() { return new URL('./asr/', location.href).href; },
  ensureWorker() {
    if (this.worker) return this.worker;

    w.onmessage = e => { const d = e.data; if (d.type === 'msg') { this.onMsg && this.onMsg(d.msg); return; } const p = this.wait[d.id]; if (!p) return; delete this.wait[d.id]; d.type === 'ok' ? p.res(d.out) : p.rej(new Error(d.msg)); };

  call(cmd, audio) { const w = this.ensureWorker(); const id = ++this.seq; return new Promise((res, rej) => { this.wait[id] = { res, rej }; if (audio) w.postMessage({ id, cmd, audio }, [audio.buffer]); else w.postMessage({ id, cmd }); }); },
  load(onMsg) { this.onMsg = onMsg; return this.call('load'); },
  async decode(blob) {
    const ab = await blob.arrayBuffer();
    const ctx = new OfflineAudioContext(1, 16000, 16000);
    const buf = await ctx.decodeAudioData(ab);

    const a = buf.getChannelData(0), b = buf.getChannelData(1), out = new Float32Array(a.length);

  },
  rms(a, s, e) { let t = 0, n = 0; for (let i = Math.max(0, s); i < Math.min(a.length, e); i += 4) { t += a[i] * a[i]; n++; } return n ? Math.sqrt(t / n) : 0; },
  bad(t) { return !t || ![...t].some(isCJK) || /字幕|订阅|点赞|打赏|谢谢观看|感谢观看|Amara|明镜|请不吝|中文字幕|字幕组/.test(t) || /(.)\1{7,}/.test(t); },
  split(s, e, text) { // chia đoạn dài theo dấu câu
    text = text.trim();
    const parts = text.split(/(?<=[，。！？!?；,])/).map(x => x.trim()).filter(Boolean);
    if (cjkCount(text) <= 18 || parts.length < 2) return [{ s, e, zh: text }];
    const groups = []; let cur = '';
    parts.forEach(p => { if (cjkCount(cur + p) > 16 && cur) { groups.push(cur); cur = p; } else cur += p; }); if (cur) groups.push(cur);

      let txt = (c.text || '').trim(); if (conv) txt = conv(txt);
      if (this.bad(txt)) return;
      const s = off + (c.timestamp[0] || 0), e = off + Math.min(segDur, c.timestamp[1] ?? segDur);
      this.split(s, Math.max(e, s + 0.6), txt).forEach(x => res.push({ id: uid(), s: x.s, e: x.e, zh: x.zh, tr: '' }));
    });
    return res;
  },
  async start(clip, blob, { fresh = false } = {}) {
    if (this.job) { toast('Đang tạo phụ đề cho video khác, đợi xong nhé.'); return; }
    const st = this.state[clip.id] = { pct: 0, msg: 'Chuẩn bị…', running: true };
    const job = this.job = { clip, stop: false };
    const paint = () => { asrPaint(clip.id); };
    try {
      await this.load(m => { st.msg = m; paint(); });
      st.msg = 'Đang tách âm thanh từ video…'; paint();
      const audio = await this.decode(blob);
      const SR = 16000, W = 28 * SR, dur = audio.length / SR;
      if (fresh) { clip.sents = []; clip.asrDone = 0; }

      while (pos < audio.length) {
        if (job.stop) { st.msg = 'Đã tạm dừng'; break; }
        let end = Math.min(audio.length, pos + W);
        if (end < audio.length) { let best = end, bestE = 1e9; for (let c = end - 4 * SR; c < end; c += SR / 20) { const v = this.rms(audio, c, c + SR / 20); if (v < bestE) { bestE = v; best = c; } } end = best; }

        if (this.rms(seg, 0, seg.length) > 0.003) {
          const got = await this.recog(seg, pos / SR, conv);
          if (!got.length && seg.length > 8 * SR) { // thử lại bằng 2 nửa nếu mô hình "lạc đề"
            const h = Math.floor(seg.length / 2);
            got.push(...await this.recog(seg.subarray(0, h), pos / SR, conv), ...await this.recog(seg.subarray(h), (pos + h) / SR, conv));
          }
          got.forEach(x => clip.sents.push(x));
        }
        pos = end; clip.asrDone = pos / SR;
        st.pct = Math.round(pos / audio.length * 100); st.msg = `Đang nghe & ghi phụ đề… ${fmt(pos / SR)} / ${fmt(dur)}`;
        clip.sents.sort((a, b) => a.s - b.s); saveClip(clip); paint();
        if (Drama.clip === clip) renderSents();
        await new Promise(r => setTimeout(r, 0));
      }
      if (pos >= audio.length) { clip.asrDone = dur; clip.asrFinished = true; st.msg = `Xong! Đã tạo ${clip.sents.length} câu phụ đề 🎉`; st.pct = 100; saveClip(clip); toast('Đã tạo xong phụ đề cho «' + clip.title + '»'); if (Cap.sample && clip.sents.length) { st.msg = '✨ AI đang soát lỗi chính tả phụ đề…'; paint(); try { await aiFixClip(clip, (i, n) => { st.msg = `✨ AI đang soát lỗi phụ đề… ${i}/${n}`; paint(); }); st.msg = `Xong! ${clip.sents.length} câu phụ đề (đã được AI soát lỗi) 🎉`; } catch (e) { st.msg = `Xong! Đã tạo ${clip.sents.length} câu phụ đề 🎉`; } } }
    } catch (e) {
      console.error(e); st.msg = 'Lỗi: ' + ((e && e.message) || e) + '. Bạn có thể dùng file phụ đề hoặc chế độ đọc phụ đề trên hình.';

};

async function aiFixClip(c, onProg) {

function parseTime(s) { s = s.trim().replace(',', '.'); const p = s.split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0]; }
function splitLines(txt) { const lines = txt.split(/\\N|\n/).map(x => x.trim()).filter(Boolean); return { zh: lines.filter(l => [...l].some(isCJK)).join(' '), tr: lines.filter(l => ![...l].some(isCJK)).join(' ') }; }
function parseSubs(text) {
  text = text.replace(/\r/g, '').replace(/^﻿/, ''); const out = [];
  if (/^\s*\[Script Info\]/m.test(text) || /^Dialogue:/m.test(text)) {
    text.split('\n').forEach(l => { if (!l.startsWith('Dialogue:')) return; const parts = l.slice(9).split(','); if (parts.length < 10) return; const { zh, tr } = splitLines(parts.slice(9).join(',').replace(/\{[^}]*\}/g, '')); if (zh) out.push({ s: parseTime(parts[1]), e: parseTime(parts[2]), zh, tr }); });
  } else if (/-->/.test(text)) {
    text.split(/\n\s*\n/).forEach(bk => { const ls = bk.split('\n'); const ti = ls.findIndex(l => l.includes('-->')); if (ti < 0) return; const [a, b] = ls[ti].split('-->'); const { zh, tr } = splitLines(ls.slice(ti + 1).join('\n').replace(/<[^>]+>/g, '')); if (zh) out.push({ s: parseTime(a), e: parseTime(b.trim().split(' ')[0]), zh, tr }); });
  } else if (/^\s*(\d+:)?\d{1,2}:\d{2}\s*$/m.test(text)) {
    const ls = text.split('\n').map(l => l.trim()).filter(Boolean); let cur = null;
    ls.forEach(l => { if (/^(\d+:)?\d{1,2}:\d{2}$/.test(l)) { if (cur && cur.zh) out.push(cur); cur = { s: parseTime(l), zh: '', tr: '' }; } else if (cur) { if ([...l].some(isCJK)) cur.zh += (cur.zh ? ' ' : '') + l; else cur.tr += (cur.tr ? ' ' : '') + l; } });
    if (cur && cur.zh) out.push(cur); out.forEach((x, i) => x.e = out[i + 1] ? out[i + 1].s : x.s + 4);
  } else text.split('\n').map(l => l.trim()).filter(l => [...l].some(isCJK)).forEach(l => out.push({ s: null, e: null, zh: l, tr: '' }));
  out.sort((a, b) => (a.s ?? 1e9) - (b.s ?? 1e9));
  return out.map(x => ({ ...x, id: uid() }));
}

    vw.innerHTML = `<label class="drop" style="margin:0">${c.yt ? `<a class="btn" href="${esc(ytLink(c, 0))}" target="_blank" rel="noopener">▶️ Mở trên YouTube</a><div class="small muted" style="margin:8px 0">Hoặc chọn file video để xem ngay tại đây:</div>` : `<div style="font-size:34px">🎞️</div><b>Chọn file video${c.file ? ' «' + esc(c.file) + '»' : ''}</b><div class="small muted">Video sẽ được lưu lại, lần sau không cần chọn nữa.</div>`}<input type="file" accept="video/*" id="refile" hidden></label>`;
    $('#refile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; c.file = f.name; c.size = f.size; try { await VDB.put(c.id, f); videoKeys.add(c.id); } catch (er) { toast('Không lưu được video vào trình duyệt.'); } if (!c.thumb) c.thumb = await thumbOf(f); saveClip(c); D.url = URL.createObjectURL(f); dramaView(m); if (!c.sents.length && !ASR.job) ASR.start(c, f); });
  }
  $('#sfind').addEventListener('input', () => renderSents());

}
function renderCtrl() {
  const D = Drama, el = $('#ctrl'); if (!el) return; const hasV = !!D.video;
  el.innerHTML = `<div class="row"><button class="btn icon ghost" data-act="dprev" title="Câu trước (←)">⏮</button><button class="btn icon" data-act="dplay" title="Phát/dừng (Space)">${hasV && !D.video.paused ? '❚❚' : '▶'}</button><button class="btn icon ghost" data-act="dnext" title="Câu sau (→)">⏭</button><button class="btn sm ghost" data-act="dreplay" title="Nghe lại câu (R)">↺ Nghe lại</button>

   <span class="sp"></span>
   <button class="btn sm ${D.mode === 'loop' ? '' : 'ghost'}" data-act="dmode" data-v="${D.mode === 'loop' ? 'watch' : 'loop'}">🔁 Lặp câu</button>

   <label><input type="checkbox" data-act="dzh" ${D.showZh ? 'checked' : ''}> chữ Hán</label><label><input type="checkbox" data-act="dpy" ${D.showPy ? 'checked' : ''}> pinyin</label><label><input type="checkbox" data-act="dtr" ${D.showTr ? 'checked' : ''}> nghĩa</label>
   ${hasV ? `<label title="Làm mờ phụ đề in sẵn trên video"><input type="checkbox" data-act="dcover" ${D.cover ? 'checked' : ''}> che phụ đề gốc</label>${D.cover ? `<input type="range" min="8" max="45" value="${D.coverH}" data-act="dcoverh" style="width:80px">` : ''}` : ''}</div>
   ${!Cap.dict ? `<div class="row" style="margin-top:8px"><textarea id="said-shadow" rows="1" style="min-height:40px;flex:1" placeholder="${IS_TOUCH ? 'Chạm vào đây → 🎤 trên bàn phím → nói lại câu thoại' : 'Nói/gõ lại câu thoại vào đây'}"></textarea><button class="btn sm soft" data-act="shadowCheck">Chấm</button></div>` : ''}
   ${D.mode === 'shadow' ? '<div class="tip">🗣 Video phát từng câu rồi dừng → bấm <b>🎙 Nói</b> (phím M) và nhại lại → bấm ⏹ → web chấm và chuyển câu tiếp.</div>' : D.mode === 'loop' ? '<div class="tip">🔁 Câu hiện tại lặp lại liên tục. Giảm tốc độ nếu nói nhanh quá.</div>' : ''}
   ${D.mode === 'sync' ? `<div class="tip"><div class="row"><button class="btn sm" data-act="syncMark">📍 Đánh dấu câu ${D.syncI + 1} (Enter)</button><button class="btn sm ghost" data-act="syncReset">Làm lại</button><button class="btn sm ghost" data-act="dmode" data-v="watch">Xong</button></div>Phát video, mỗi khi câu tô hồng bắt đầu được nói thì bấm Enter.</div>` : ''}
   ${D.mode === 'ocr' ? `<div class="tip"><div class="row"><button class="btn sm" data-act="ocrS">S · Bắt đầu câu</button><button class="btn sm ai" data-act="ocrE">E · Hết câu & đọc chữ</button><button class="btn sm ghost" data-act="dmode" data-v="watch">Xong</button><span id="ocrState" class="tag l">${D.mark != null ? 'Từ ' + fmt(D.mark) : ''}</span></div>Bấm S khi nhân vật bắt đầu nói, E khi nói xong (lúc chữ còn trên màn hình).</div>` : ''}`;
  $('#dspeed').addEventListener('change', e => { D.speed = +e.target.value; if (D.video) D.video.playbackRate = D.speed; });
  const ch = $('[data-act=dcoverh]'); if (ch) ch.addEventListener('input', e => { D.coverH = +e.target.value; const v = $('#vcover'); if (v) v.style.height = D.coverH + '%'; });
}
function renderTools() {
  const c = Drama.clip, el = $('#tools'); if (!el) return;
  el.innerHTML = `<div class="tools">
   ${Drama.video || videoKeys.has(c.id) ? `<button class="btn sm ghost" data-act="asrRedo">🤖 Tạo lại phụ đề từ giọng nói</button>` : ''}
   <button class="btn sm ghost" data-act="aiFix">✨ AI sửa lỗi chính tả phụ đề</button>
   <button class="btn sm ghost" data-act="addSubs">📄 Dùng file phụ đề có sẵn</button>
   ${Drama.video ? `<button class="btn sm ghost" data-act="dmode" data-v="ocr">📷 Đọc phụ đề in trên hình</button><button class="btn sm ghost" data-act="dmode" data-v="sync">⏱ Gắn giờ cho lời thoại</button>` : ''}
   <button class="btn sm ghost" data-act="toSimp">繁→简 Đổi sang giản thể</button>
   <button class="btn sm ghost" data-act="renameClip">✏️ Đổi tên</button>
   <button class="btn sm ghost" data-act="delVideo">🧹 Xoá video khỏi bộ nhớ (giữ phụ đề)</button>
   <button class="btn sm ghost" data-act="delClip" style="color:var(--bad)">🗑 Xoá bài học</button></div>
   <div class="tiny muted" style="margin-top:8px">Phím tắt: Space phát/dừng · ← → câu trước/sau · R nghe lại · M micro</div>`;
}
function curSent() { return Drama.clip && Drama.clip.sents[Drama.idx]; }
function renderSub() {
  const s = curSent(), D = Drama, el = $('#subbox'); if (!el) return;
  el.className = 'sub' + (D.showZh ? '' : ' hidezh');
  if (!s) { el.innerHTML = '<span class="muted small">Phụ đề hiện ở đây</span>'; return; }
  el.innerHTML = `<div class="z">${D.showPy ? ruby(s.zh) : esc(s.zh)}</div>${D.showTr && (s.vi || s.tr) ? `<div class="t">${esc(s.vi || s.tr)}</div>` : ''}`;
}
function renderSents() {
  const c = Drama.clip, el = $('#slist'); if (!el) return;
  const q = ($('#sfind') || {}).value || '';
  const list = c.sents.map((s, i) => [s, i]).filter(([s]) => !q || s.zh.includes(q) || (s.vi || '').toLowerCase().includes(q.toLowerCase()) || toneless(py(s.zh)).includes(toneless(q)));
  const st = ASR.state[c.id];
  el.innerHTML = list.length ? list.map(([s, i]) => `<div class="sitem ${i === Drama.idx ? 'on' : ''} ${Drama.mode === 'sync' && i === Drama.syncI ? 'on' : ''}" data-act="seek" data-i="${i}" id="si-${i}">
    <div class="tm">${s.s != null ? fmt(s.s) : '—'}</div><div class="sp"><div class="zz">${esc(s.zh)} ${s.star ? '⭐' : ''}</div>${s.vi || s.tr ? `<div class="vv">${esc(s.vi || s.tr)}</div>` : ''}
    <div class="acts"><button class="btn icon sm ghost" data-act="say" data-t="${esc(s.zh)}" title="Giọng đọc mẫu">🔊</button><button class="btn icon sm ghost" data-act="starSent" data-i="${i}" title="Lưu vào Luyện nói">⭐</button><button class="btn sm ai" data-act="explain" data-i="${i}">✨ Giải thích</button><button class="btn icon sm ghost" data-act="editSent" data-i="${i}" title="Sửa">✏️</button><button class="btn icon sm ghost" data-act="delSent" data-i="${i}" title="Xoá">🗑</button>${c.yt ? `<a class="btn icon sm ghost" href="${esc(ytLink(c, s.s))}" target="_blank" rel="noopener">▶️</a>` : ''}</div>
    ${s.ex ? `<div class="aiout small">${s.ex}</div>` : ''}</div></div>`).join('') : `<div class="empty small">${st && st.running ? '🤖 AI đang nghe video, phụ đề sẽ hiện dần ở đây…' : 'Chưa có lời thoại.'}</div>`;
  const hb = document.querySelector('.side b'); if (hb) hb.textContent = `Lời thoại · ${c.sents.length} câu`;
}
function setIdx(i, scroll = true) {
  if (i === Drama.idx) return; Drama.idx = i; renderSub();
  $$('.sitem.on').forEach(x => { if (Drama.mode !== 'sync') x.classList.remove('on'); });
  const el = $('#si-' + i); if (el) { el.classList.add('on'); if (scroll) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function findIdx(t) { const ss = Drama.clip.sents; for (let i = 0; i < ss.length; i++) { const s = ss[i]; if (s.s != null && t >= s.s - 0.05 && t < (s.e ?? s.s + 4)) return i; } return -1; }
function dLoop() {
  const D = Drama; if (D.raf) cancelAnimationFrame(D.raf);
  const step = () => {
    const v = D.video; if (!v || !v.isConnected) { D.raf = 0; return; }
    const t = v.currentTime, cur = curSent();
    if ((D.mode === 'loop' || D.mode === 'shadow') && cur && cur.e != null && t >= cur.e && t < cur.e + 0.8 && !D.waiting) {
      if (D.mode === 'loop') v.currentTime = cur.s;
      else { v.pause(); D.waiting = true; const sr = $('#shadowRes'); if (sr) sr.innerHTML = '<div class="tip" style="text-align:center">🎙 Đến lượt bạn! Bấm <b>Nói</b> hoặc phím <b>M</b></div>'; }
    } else if (D.mode !== 'sync') { const i = findIdx(t); if (i >= 0 && i !== D.idx && !D.waiting) setIdx(i); }
    if (!v.paused) D.raf = requestAnimationFrame(step); else D.raf = 0;
  };
  D.raf = requestAnimationFrame(step); renderCtrl();
}
function playSent(i) {
  const D = Drama, s = D.clip && D.clip.sents[i]; if (!s) return;
  D.waiting = false; S.res.shadow = null; const sr = $('#shadowRes'); if (sr) sr.innerHTML = ''; setIdx(i);
  if (D.video && s.s != null) { D.video.currentTime = Math.max(0, s.s - 0.05); D.video.play().catch(() => {}); }
  else speak(s.zh, D.speed);
}
async function captureFrame() {
  const v = Drama.video; if (!v || !v.videoWidth) throw { message: 'Chưa có video' };
  const w = v.videoWidth, h = v.videoHeight, y = Math.floor(h * 0.55);
  const cv = document.createElement('canvas'); const sc = Math.min(1, 1280 / w); cv.width = Math.round(w * sc); cv.height = Math.round((h - y) * sc);
  cv.getContext('2d').drawImage(v, 0, y, w, h - y, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
}
async function ocrAdd(s, e, btn) {
  await busy(btn, async () => {
    const blob = await captureFrame();
    const r = await ai('Ảnh là phần dưới của một khung hình phim Trung Quốc. Hãy đọc chính xác dòng phụ đề tiếng Trung (nếu song ngữ chỉ lấy dòng tiếng Trung). Trả JSON {"zh":"phụ đề tiếng Trung","vi":"dịch tiếng Việt tự nhiên"}. Không thấy phụ đề tiếng Trung thì trả {"zh":""}.', { json: true, images: [blob], tier: 'quick' });
    if (!r.zh) { toast('Không thấy phụ đề tiếng Trung trên khung hình này.'); return; }
    const c = Drama.clip; const sent = { id: uid(), s, e, zh: r.zh.trim(), vi: r.vi || '', tr: '' };
    c.sents.push(sent); c.sents.sort((a, b) => (a.s ?? 1e9) - (b.s ?? 1e9)); Drama.save(); Drama.idx = c.sents.indexOf(sent);
    renderSents(); renderSub(); toast('Đã thêm: ' + sent.zh);
  });
}
async function dramaAct(a, d, el, e) {
  const c = Drama.clip;
  switch (a) {
    case 'createClip': await createClipOther(); break;
    case 'openClip': S.ui.clipId = d.id; Drama.release(); Drama.mode = 'watch'; render(); break;
    case 'backClips': S.ui.clipId = null; Drama.release(); render(); break;
    case 'renameClip': { const v = await promptBox('Tên mới', c.title); if (v) { c.title = v; Drama.save(); render(); } break; }
    case 'delVideo': if (await confirmBox('Xoá video khỏi bộ nhớ trình duyệt? Phụ đề và bài học vẫn giữ.')) { await VDB.del(c.id); videoKeys.delete(c.id); Drama.release(); S.ui.clipId = c.id; render(); toast('Đã giải phóng bộ nhớ'); } break;
    case 'delClip': if (await confirmBox('Xoá hẳn bài học này (cả video đã lưu và phụ đề)?')) { if (ASR.job && ASR.job.clip === c) ASR.job.stop = true; await VDB.del(c.id); videoKeys.delete(c.id); Store.del('clips', c.id); delete S.clips[c.id]; S.ui.clipId = null; Drama.release(); render(); } break;
    case 'shadowCheck': { const ta = $('#said-shadow'); const t = ta ? ta.value.trim() : ''; if (!t) { toast('Hãy nói hoặc gõ câu trước'); break; } onMicDone('shadow', t); ta.value = ''; break; }
    case 'asrStop': if (ASR.job) ASR.job.stop = true; break;
    case 'asrGo': case 'asrRedo': {
      if (a === 'asrRedo' && c.sents.length && !(await confirmBox('Tạo lại sẽ thay toàn bộ phụ đề hiện tại. Tiếp tục?'))) break;
      let b = null; try { b = await VDB.get(c.id); } catch (er) {}
      if (!b) { toast('Cần chọn lại file video trước.'); break; }
      if (IS_PHONE && !(await confirmBox('Tạo phụ đề trên điện thoại rất nặng và có thể làm treo máy với tập phim dài. Nên làm trên máy tính (phụ đề sẽ tự đồng bộ). Vẫn tiếp tục?'))) break;
    const box = $('#asr-' + c.id); if (box) box.style.display = '';
      ASR.start(c, b, { fresh: a === 'asrRedo' }); break;
    }
    case 'aiFix': await busy(el, async () => { if (!c.sents.length) { toast('Chưa có phụ đề'); return; } const n = await aiFixClip(c, (i, t) => { el.innerHTML = `<span class="spin"></span> ${i}/${t}`; }); renderSub(); toast(`Đã sửa ${n} câu ✨`); }); break;
    case 'dmode': Drama.mode = d.v; Drama.waiting = false; Drama.mark = null; if (d.v === 'sync') Drama.syncI = Math.max(0, c.sents.findIndex(s => s.s == null)); renderCtrl(); renderSents(); { const sr = $('#shadowRes'); if (sr) sr.innerHTML = ''; } if (d.v === 'ocr' || d.v === 'sync') { const det = el.closest('details'); if (det) det.open = false; $('#ctrl').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } break;
    case 'seek': if (e.target.closest('button,a')) break; playSent(+d.i); break;
    case 'dplay': if (Drama.video && Drama.mode === 'shadow' && Drama.waiting) playSent(Math.min(c.sents.length - 1, Drama.idx + 1)); else if (Drama.video) { Drama.waiting = false; Drama.video.paused ? Drama.video.play().catch(() => {}) : Drama.video.pause(); } else if (curSent()) speak(curSent().zh, Drama.speed); else playSent(0); break;
    case 'dprev': playSent(Math.max(0, Drama.idx - 1)); break;
    case 'dnext': playSent(Math.min(c.sents.length - 1, Drama.idx + 1)); break;
    case 'dreplay': playSent(Math.max(0, Drama.idx)); break;
    case 'starSent': { const s = c.sents[+d.i]; s.star = !s.star; Drama.save(); if (s.star) { const p = { id: uid(), zh: s.zh, vi: s.vi || s.tr || '', src: 'phim', from: c.title, at: Date.now() }; S.phrases[p.id] = p; Store.put('phrases', p); toast('Đã lưu vào ⭐ Câu của tôi (Luyện nói)'); } renderSents(); break; }
    case 'explain': await busy(el, async () => { const s = c.sents[+d.i]; const ctx = c.sents.slice(Math.max(0, +d.i - 2), +d.i + 3).map(x => x.zh).join(' / '); const r = await ai(`Câu thoại trong phim Trung Quốc: "${s.zh}" (ngữ cảnh: ${ctx}). Giải thích cho học viên HSK5. Trả JSON {"vi":"dịch tự nhiên","note":"sắc thái, khẩu ngữ, ngữ pháp đáng chú ý (tiếng Việt, tối đa 3 câu)","words":[{"h":"","p":"","m":""}] (tối đa 5 từ đáng học)}`, { json: true }); s.vi = s.vi || r.vi; s.ex = `<div>${esc(r.vi)}</div><div style="margin:4px 0">${esc(r.note)}</div>` + (r.words || []).map(w => `<span class="row" style="gap:6px;margin:2px 0"><b class="zh">${esc(w.h)}</b> <span style="color:var(--pink2)">${esc(w.p)}</span> ${esc(w.m)} ${S.words[wid(w.h)] ? '<span class="tag m">đã có</span>' : `<button class="btn icon sm" data-act="addAiWord" data-src="phim" data-w="${esc(JSON.stringify({ ...w, lv: 'MOI', ex: s.zh, exvi: r.vi }))}">➕</button>`}</span>`).join(''); Drama.save(); renderSents(); renderSub(); }); break;
    case 'editSent': { const s = c.sents[+d.i]; const v = await promptBox('Sửa câu thoại', s.zh); if (v != null && v.trim()) { s.zh = v.trim(); Drama.save(); renderSents(); renderSub(); } break; }
    case 'delSent': { c.sents.splice(+d.i, 1); if (Drama.idx >= c.sents.length) Drama.idx = -1; Drama.save(); renderSents(); break; }
    case 'transAll': await busy(el, async () => { const todo = c.sents.filter(s => !s.vi); if (!todo.length) { toast('Đã dịch hết rồi'); return; } for (let i = 0; i < todo.length; i += 40) { const ch = todo.slice(i, i + 40); el.innerHTML = `<span class="spin"></span> ${i}/${todo.length}`; const r = await ai(`Dịch các câu thoại phim Trung Quốc sau sang tiếng Việt tự nhiên, đúng văn phong phim. Trả JSON array đúng ${ch.length} chuỗi theo thứ tự.\n${JSON.stringify(ch.map(s => s.zh))}`, { json: true }); r.forEach((v, k) => { if (ch[k]) ch[k].vi = v; }); renderSents(); } Drama.save(); renderSub(); toast('Đã dịch xong 🎉'); }); break;
    case 'toSimp': await busy(el, async () => { if (!window.OpenCC) await loadScript(LIB_OPENCC); const cv = OpenCC.Converter({ from: 'tw', to: 'cn' }); c.sents.forEach(s => s.zh = cv(s.zh)); Drama.save(); renderSents(); renderSub(); toast('Đã chuyển sang giản thể'); }); break;
    case 'addSubs': subsForm(); break;
    case 'syncMark': syncMark(); break;
    case 'syncReset': Drama.syncI = 0; renderCtrl(); renderSents(); break;
    case 'ocrS': ocrStart(); break;
    case 'ocrE': ocrEnd(el); break;
  }
}

boot();
